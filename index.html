<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard — Day 01</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="wrap">
    <header class="app">
      <h1>🌤 Weather Dashboard</h1>
      <button class="theme-toggle" id="theme-toggle">☀️ / 🌙</button>
    </header>

    <div class="search-row">
      <input type="text" id="city-input" placeholder="Nhập tên thành phố... (VD: Ha Noi)" />
      <button class="btn" id="search-btn">Tìm</button>
      <button class="btn ghost" id="locate-btn">📍 Vị trí</button>
    </div>

    <div class="status" id="status-msg" hidden></div>

    <div class="favorites" id="favorites-row"></div>

    <div class="unit-toggle" id="unit-toggle">
      <span data-unit="metric">°C</span><span data-unit="imperial">°F</span>
    </div>

    <div class="card" id="current-card" hidden>
      <!-- Nội dung được render bởi ui.js -->
    </div>

    <div class="card map-card">
      <p class="forecast-title">Bản đồ nhiệt độ</p>
      <div id="weather-map"></div>
      <div class="map-legend">
        <span>Lạnh</span>
        <div class="bar"></div>
        <span>Nóng</span>
      </div>
    </div>

    <div class="card" id="forecast-card" hidden>
      <p class="forecast-title">Dự báo 5 ngày tới</p>
      <div class="forecast-strip"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
